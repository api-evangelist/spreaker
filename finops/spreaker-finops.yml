description: >-
  FinOps view of Spreaker spend. Spreaker (owned by iHeartMedia) bills podcast
  hosting on flat monthly subscription tiers - Free Speech (0 USD), Broadcaster
  (20 USD), Anchorman (50 USD), and Publisher (250 USD) - rather than on API
  call volume or metered usage. The API itself is included with the account, so
  the primary cost driver is the subscription tier and the features it unlocks
  (statistics retention, private podcasts, collaborators, and the direct ad
  campaign manager). Spreaker is also a revenue source, not only a cost: creators
  earn from programmatic ads, listener subscriptions, and the Supporters Club,
  where the Supporters Club fee drops from 20 percent on the free tier to 0
  percent on paid tiers.
notes: >-
  Because billing is flat-rate per tier, cost is predictable and does not scale
  with API traffic. Optimize by matching the tier to the features actually used
  and by factoring in monetization revenue that offsets the subscription. Verify
  current tier prices on https://www.spreaker.com/plans.
