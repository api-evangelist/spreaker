meters:
- name: subscription_tier
  description: Flat monthly subscription fee for the account's plan (Free Speech, Broadcaster, Anchorman, or Publisher).
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: ad_revenue
  description: Revenue earned by the creator from programmatic ad monetization (a credit against cost, not a charge).
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - show
- name: subscription_revenue
  description: Revenue from listener subscriptions and the Supporters Club, net of the tier's Supporters Club fee.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - show
principles:
- name: Visibility
  description: Track the flat monthly subscription cost per account and attribute it to the podcasts and teams using the account.
- name: Allocation
  description: Map each show and its collaborators to a cost center so the single account fee is allocated across workloads.
- name: Optimization
  description: Right-size the tier to the features actually used (stats retention, private podcasts, collaborators, ad campaign manager) and weigh subscription cost against ad and subscription revenue earned on the platform.
- name: Accountability
  description: Review the tier monthly against feature usage and monetization; downgrade or upgrade as podcast volume and ad-sales needs change.
