aid: spreaker
url: https://raw.githubusercontent.com/api-evangelist/spreaker/refs/heads/main/apis.yml
name: Spreaker
kind: company
description: Spreaker is a podcast hosting, distribution, and monetization platform
  owned by iHeartMedia (acquired via parent company Voxnest in 2020). It lets
  creators record, host, and publish podcasts, auto-distribute to Apple Podcasts,
  Spotify, and iHeartRadio, and monetize through programmatic ads, listener
  subscriptions, and a Supporters Club. Spreaker exposes a documented public REST
  API (v2) over HTTPS at api.spreaker.com, authenticated with OAuth2, covering
  users, shows, episodes, playback and messaging, analytics/statistics, search and
  discovery, and advertising campaign management.
